services:
  db:
    image: mysql
    restart: always
    env_file:
      - .env
    ports:
      - 3366:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./minio-data:/mnt/data
    command: server /mnt/data --console-address ":9001"
    env_file:
      - .env

  # seaweed:
  #   image: chrislusf/seaweedfs
  #   ports:
  #     - 8333:8333   # endpoint
  #     - 9333:9333   # overview
  #     - 8888:8888   # filer
  #     - 23646:23646 # admin
  #   environment:
  #     - AWS_ACCESS_KEY_ID=value
  #     - AWS_SECRET_ACCESS_KEY=secret
  #     - S3_BUCKET=my-bucket

  api:
    build:
      context: .
      args:
        CMD: api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - cmd/api/.env
    environment:
      - MYSQL_HOST=db:3306
      - MINIO_ENPOINT=minio:9000
    ports:
      - 3000:3000


  admin:
    build:
      context: .
      args:
        CMD: admin
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - cmd/admin/.env
    environment:
      - MINIO_ENPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq:5672
      - MYSQL_HOST=db:3306
    ports:
      - 3001:3001


  epub_parser:
    build:
      context: .
      args:
        CMD: epub_parser
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - cmd/epub_parser/.env
    environment:
      - MINIO_ENPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq:5672
      - MYSQL_HOST=db:3306


  prepare_chapters:
    build:
      context: .
      args:
        CMD: prepare_chapters
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - cmd/prepare_chapters/.env
    environment:
      - MINIO_ENPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq:5672
      - MYSQL_HOST=db:3306
      - AI_TEST_MODE=${AI_TEST_MODE:-true}

  generate_script:
    build:
      context: .
      args:
        CMD: generate_script
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - cmd/generate_script/.env
    environment:
      - MYSQL_HOST=db:3306
      - MINIO_ENPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq:5672
      - AI_TEST_MODE=${AI_TEST_MODE:-true}


  generate_tss:
    build:
      context: .
      args:
        CMD: generate_tts
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - cmd/generate_tts/.env
    environment:
      - MINIO_ENPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq:5672
      - MYSQL_HOST=db:3306
      - AI_TEST_MODE=${AI_TEST_MODE:-true}

      
  