services:
  db:
    image: mysql
    restart: always
    env_file:
      - .env
    ports:
      - 3366:3306

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./minio-data:/mnt/data
    command: server /mnt/data --console-address ":9001"
    env_file:
      - .env

  # seaweed:
  #   image: chrislusf/seaweedfs
  #   ports:
  #     - 8333:8333   # endpoint
  #     - 9333:9333   # overview
  #     - 8888:8888   # filer
  #     - 23646:23646 # admin
  #   environment:
  #     - AWS_ACCESS_KEY_ID=value
  #     - AWS_SECRET_ACCESS_KEY=secret
  #     - S3_BUCKET=my-bucket


  api:
    build:
      context: .
      args:
        CMD: api
    env_file:
      - cmd/api/.env
    environment:
      - MYSQL_HOST=db:3306
    ports:
      - 3000:3000


  upload_book:
    build:
      context: .
      args:
        CMD: upload_book
    env_file:
      - cmd/upload_book/.env
    environment:
      - MINIO_ENPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq:5672
      - MYSQL_HOST=db:3306
    ports:
      - 3001:3001


  epub_parser:
    build:
      context: .
      args:
        CMD: epub_parser
    env_file:
      - cmd/epub_parser/.env
    environment:
      - MINIO_ENPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq:5672
      - MYSQL_HOST=db:3306


  prepare_chapters:
    build:
      context: .
      args:
        CMD: prepare_chapters
    env_file:
      - cmd/prepare_chapters/.env
    environment:
      - MINIO_ENPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq:5672
      - MYSQL_HOST=db:3306

  generate_script:
    build:
      context: .
      args:
        CMD: generate_script
    env_file:
      - cmd/generate_script/.env
    environment:
      - MINIO_ENPOINT=minio:9000
      - RABBITMQ_HOST=rabbitmq:5672
  